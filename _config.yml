# Site settings
title: Israel Fulton
subtitle: "Economics | International Affairs | AI | Climate & Energy"
email: israelfulton@wustl.edu
description: >-
  Personal site of Israel Fulton — writing on economics, international affairs,
  artificial intelligence, and climate & energy.
baseurl: ""
url: "https://israelfulton.com"
logo: # optional site logo
twitter_username: IsraelJFulton
github_username: IsraelFulton

# Theme
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "dark"

# Author (default for all pages)
author: IsraelFulton

# Reading
words_per_minute: 200

# Build settings
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag

# Collections
collections:
  pages:
    output: true
    permalink: /:title/

# Defaults — apply front-matter to all pages/posts automatically
defaults:
  # All posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
  # All pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # Top-level pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
