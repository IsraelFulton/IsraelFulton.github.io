{% assign project = include.project %}
<article class="project-card" aria-labelledby="project-{{ project.slug | slugify }}">
  {% if project.category %}<p class="entry-meta">{{ project.category | escape }}</p>{% endif %}
  <h3 id="project-{{ project.slug | slugify }}"><a href="{{ project.url | relative_url }}">{{ project.title | escape }}</a></h3>
  <p>{{ project.summary | escape }}</p>
  <p class="project-card__link"><a href="{{ project.url | relative_url }}">Read more<span class="visually-hidden">: {{ project.title | escape }}</span> <span aria-hidden="true">&rarr;</span></a></p>
</article>
