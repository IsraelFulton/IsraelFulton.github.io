# Site identity and canonical GitHub Pages domain.
title: Israel Fulton
name: Israel Fulton
email: israeljfulton@gmail.com
description: >-
  Israel Fulton is an analyst at Analysis Group in Washington, D.C.
  Explore his analytical projects, research, and writing on economics,
  institutions, and technology.
locale: en-US
lang: en
timezone: America/New_York
baseurl: ""
url: "https://israelfulton.com"
repository: IsraelFulton/IsraelFulton.github.io

# Preserve the existing theme version and skin.
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "dark"
author: IsraelFulton
og_image: /assets/images/avatar.jpeg
twitter:
  username: IsraelJFulton
social:
  type: Person
  name: Israel Fulton
  links:
    - https://x.com/IsraelJFulton
    - https://www.linkedin.com/in/israel-fulton/
    - https://github.com/IsraelFulton
    - https://limitingfactors.substack.com

words_per_minute: 200
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

# Treat the existing standalone pages as pages, without synthetic post dates.
include:
  - _pages

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      share: true
      related: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      author_profile: true
      show_date: false
      share: false

# Keep existing post URLs, including /meta/hello-world/.
permalink: /:categories/:title/

exclude:
  - .bundle/
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - assets/images/README.md
  - docs/
  - script/
